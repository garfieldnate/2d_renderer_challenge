name = "renderer"
version = "0.2.0"
defaultTargets = ["tests", "render"]

[[lean_lib]]
name = "Renderer"

# the per-feature test modules; Tests.lean is the executable that runs them
[[lean_lib]]
name = "Suite"
globs = ["Suite.*"]

[[lean_exe]]
name = "tests"
root = "Tests"

[[lean_exe]]
name = "render"
root = "Render"
